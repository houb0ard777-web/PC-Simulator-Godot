
name: Unpack Godot Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Godot ZIP
        run: |
          mkdir -p extracted
          unzip -o PC-Simulator-Godot-Prototype.zip -d extracted
          find extracted -maxdepth 3 -type f
          cp -rv extracted/. .
          rm -rf extracted
          rm -f .github/workflows/android.yml
          git status --short

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Godot project"
            git push
          fi
