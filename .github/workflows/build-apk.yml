
name: Build PC Simulator APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android
        run: |
          mkdir -p ~/.config/godot
          mkdir -p build

          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"

          echo "Java: $JAVA_PATH"
          echo "Android: $SDK_PATH"

          keytool -genkeypair \
            -keystore /tmp/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: godot --headless --editor --path . --import

      - name: Build APK
        run: |
          godot --headless --path . \
            --export-debug "Android" \
            build/PC-Simulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PC-Simulator-Android
          path: build/PC-Simulator.apk
          if-no-files-found: error

