
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      GODOT_VERSION: "4.3"
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
          sudo chown -R "$USER" "$ANDROID_HOME"

          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip

          unzip -q /tmp/android-tools.zip -d /tmp

          mv /tmp/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          "$SDKMANAGER" --list_installed

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp

          sudo install -m 755 \
            /tmp/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --headless --version

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Check project
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -f export_presets.cfg

          echo "Godot project found"
          ls -la

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path . --editor --import

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/PC-Simulator.apk

          test -s build/PC-Simulator.apk

          ls -lh build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PC-Simulator-Android
          path: build/PC-Simulator.apk
          if-no-files-found: error
          retention-days: 30
