
name: Build PC Simulator APK V6

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
          sudo chown -R "$USER" "$ANDROID_HOME"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp
          mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDK" --licenses < <(yes) > /tmp/sdk-licenses.log
          "$SDK" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Install Godot and templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -fsSL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
          curl -fsSL --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          TEMPLATES="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATES"
          unzip -j /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk -d "$TEMPLATES"
          test -s "$TEMPLATES/android_debug.apk"
          test -s "$TEMPLATES/android_release.apk"

      - name: Configure Godot 4.3 and signing
        run: |
          CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$CONFIG" build
          test -x "$JAVA_HOME/bin/java"
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storetype JKS -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          cat > "$CONFIG/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Enable Android texture format
        run: |
          test -f project.godot
          test -f export_presets.cfg
          sed -i '/^textures\/vram_compression\/import_etc2_astc[[:space:]]*=/d' project.godot
          sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' project.godot
          grep -Fx 'textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Import and test game
        run: |
          godot --headless --editor --path . --import 2>&1 | tee /tmp/import.log
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/game.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log /tmp/game.log; then exit 1; fi

      - name: Export Android APK
        run: |
          godot --headless --verbose --path . --export-debug Android build/PC-Simulator.apk
          test -s build/PC-Simulator.apk
          unzip -tq build/PC-Simulator.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/PC-Simulator.apk
          ls -lh build/PC-Simulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PC-Simulator-Android
          path: build/PC-Simulator.apk
          if-no-files-found: error
          retention-days: 30
